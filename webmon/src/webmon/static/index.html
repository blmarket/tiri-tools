<html lang="en">
<head>

<title>webmon</title>
<link rel="stylesheet" href="/vendor/xterm.css">

</head>
<body>
<div id="layout">

    <header id="rail-head">
      <span id="brand">webmon</span>
      <span id="tier" class="badge">…</span>

    <div id="tree"></div>
