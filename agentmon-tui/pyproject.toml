[project]
name = "tiri-agentmon"
version = "0.1.0"
description = "Create and monitor coding-agent runs in git worktrees through tiri."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=8.0,<9",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
agentmon = "agentmon.app:main"
looper = "agentmon.looper:main"
demo = "agentmon.transcript_demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentmon"]

[tool.pytest.ini_options]
pythonpath = ["src"]
